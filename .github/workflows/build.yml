name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - name: Ranger les fichiers
        run: |
          mkdir -p proj/src/main/java/com/nicolas/fpsguard proj/src/main/resources
          cp *build.gradle proj/build.gradle
          cp gradle.properties settings.gradle proj/
          cp FpsGuardClient.java proj/src/main/java/com/nicolas/fpsguard/
          cp fabric.mod.json proj/src/main/resources/
      - run: cd proj && gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: fps-guard-jar
          path: proj/build/libs/*.jar
